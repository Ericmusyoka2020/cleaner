<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama Fua - Clean Home. Fresh Life.</title>

    <style>
        :root {
            --brand-dark-teal: #0d5c75;
            --brand-primary-teal: #147b96;
            --brand-light-teal: #e8f4f8;
            --brand-orange: #e75b43;
            --brand-bg: #f4f8fa;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--brand-bg);
            color: var(--text-dark);
        }

        .full-screen-container {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        .hero-banner {
            flex: 1.2;
            background: radial-gradient(circle, rgba(20, 123, 150, 0.15) 0%, rgba(13, 92, 117, 0.3) 100%), #eaf4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .hero-image {
            max-width: 85%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 20px;
        }

        .app-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #ffffff;
            overflow-y: auto;
        }

        .content-box {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .brand-header {
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 36px;
            font-weight: 800;
        }

        .brand-title .mama { color: var(--brand-dark-teal); }
        .brand-title .fua { color: var(--brand-orange); }

        .tagline {
            font-size: 14px;
            font-weight: 700;
            color: var(--brand-primary-teal);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
        }

        .role-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--brand-bg);
            border: 2px solid #d1d5db;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
        }

        .role-card.selected {
            border-color: var(--brand-primary-teal);
            background: var(--brand-light-teal);
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-dark-teal);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-orange);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            margin-top: 14px;
            width: 100%;
            text-decoration: underline;
        }

        .hidden { display: none !important; }

        @media (max-width: 850px) {
            .full-screen-container { flex-direction: column; }
            .hero-banner { height: 25vh; flex: none; }
        }
    </style>
</head>
<body>

    <div class="full-screen-container">
        <div class="hero-banner">
            <img src="pic.png" alt="Mama Fua Services" class="hero-image">
        </div>

        <div class="app-panel">
            <div class="content-box">
                <div class="brand-header">
                    <h1 class="brand-title"><span class="mama">Mama</span> <span class="fua">Fua</span></h1>
                    <p class="tagline">Clean Home. Fresh Life.</p>
                </div>

                <!-- Step 1: Select Role -->
                <div id="step-role">
                    <p style="font-size: 15px; font-weight: 700; color: var(--brand-dark-teal); margin-bottom: 16px;">
                        Select your purpose:
                    </p>

                    <div class="role-card" id="card-cleaner" onclick="selectRole('cleaner')">
                        <input type="radio" name="role" id="radio-cleaner">
                        <div>
                            <strong>I am a Cleaner</strong>
                            <p style="font-size: 12px; color: var(--text-muted);">Register to find cleaning jobs near you</p>
                        </div>
                    </div>

                    <div class="role-card" id="card-boss" onclick="selectRole('boss')">
                        <input type="radio" name="role" id="radio-boss">
                        <div>
                            <strong>I am Hiring</strong>
                            <p style="font-size: 12px; color: var(--text-muted);">Find professional cleaners for your home</p>
                        </div>
                    </div>

                    <button class="btn-primary" onclick="goToDetails()">Next</button>
                </div>

                <!-- Step 2: Form Details -->
                <div id="step-details" class="hidden">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label for="phone">Safaricom Phone Number</label>
                        <input type="tel" id="phone" placeholder="0712345678">
                    </div>

                    <div id="cleaner-options" class="hidden">
                        <div class="form-group">
                            <label for="tierSelect">Job Pay Tier</label>
                            <select id="tierSelect">
                                <option value="1000">KES 1,000 Job Category</option>
                                <option value="1500">KES 1,500 Job Category</option>
                                <option value="1800">KES 1,800 Job Category</option>
                            </select>
                        </div>
                    </div>

                    <div id="boss-options" class="hidden">
                        <div class="form-group">
                            <label for="genderPref">Cleaner Gender Preference</label>
                            <select id="genderPref">
                                <option value="female">Female</option>
                                <option value="male">Male</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-primary" onclick="submitDetails()">Submit Request</button>
                    <button class="btn-text" onclick="showStep('step-role')">← Back</button>
                </div>

                <!-- Step 3: Service Confirmation -->
                <div id="step-confirmation" class="hidden">
                    <div style="padding: 20px; background: var(--brand-light-teal); border-radius: 12px; text-align: left; margin-bottom: 16px;">
                        <h3 style="color: var(--brand-dark-teal); margin-bottom: 8px;">Request Submitted</h3>
                        <p style="font-size: 14px; color: var(--text-dark);" id="summaryText"></p>
                    </div>
                    <button class="btn-text" onclick="showStep('step-role')">← Start Over</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRole = null;

        function selectRole(role) {
            currentRole = role;
            document.getElementById('card-cleaner').classList.toggle('selected', role === 'cleaner');
            document.getElementById('card-boss').classList.toggle('selected', role === 'boss');
            document.getElementById('radio-cleaner').checked = (role === 'cleaner');
            document.getElementById('radio-boss').checked = (role === 'boss');
        }

        function showStep(stepId) {
            ['step-role', 'step-details', 'step-confirmation'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(stepId).classList.remove('hidden');
        }

        function goToDetails() {
            if (!currentRole) {
                alert('Please select an option to proceed.');
                return;
            }

            document.getElementById('cleaner-options').classList.toggle('hidden', currentRole !== 'cleaner');
            document.getElementById('boss-options').classList.toggle('hidden', currentRole !== 'boss');
            showStep('step-details');
        }

        function submitDetails() {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!name || !phone) {
                alert('Please complete all required fields.');
                return;
            }

            const summary = document.getElementById('summaryText');
            if (currentRole === 'cleaner') {
                const tier = document.getElementById('tierSelect').value;
                summary.innerHTML = `Thank you, <strong>${name}</strong>. Your application for the KES ${tier} category has been recorded. We will contact you at <strong>${phone}</strong> when matching work is available.`;
            } else {
                const gender = document.getElementById('genderPref').value;
                summary.innerHTML = `Thank you, <strong>${name}</strong>. Your request for a ${gender} cleaner has been received. Our team will follow up via <strong>${phone}</strong>.`;
            }

            showStep('step-confirmation');
        }
    </script>
</body>
</html>
